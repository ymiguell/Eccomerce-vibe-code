# Publica o site no GitHub Pages a cada push na branch main.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
    # Mudanças só no backend não mexem no site
    paths-ignore:
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # O site fica em https://<usuário>.github.io/<repositório>/
          BASE_PATH: /${{ github.event.repository.name }}/
      # Abrir direto um link como /produto/abc devolve 404 no Pages; o 404.html carrega o app e o React Router resolve a rota
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
